<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Kingdom Builder 3D</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- UI Overlay -->
  <div id="ui-overlay">
    <div id="hud">
      <div>Gold: $<span id="gold-val">100</span></div>
      <div>Tax: +$<span id="tax-val">0</span>/s</div>
    </div>

    <div id="toolbar">
      <button class="tool-btn active" data-tool="inspect">Inspect</button>
      <button class="tool-btn" data-tool="road">Road ($5)</button>
      <button class="tool-btn" data-tool="house">House ($20)</button>
      <button class="tool-btn" data-tool="farm">Farm ($35)</button>
      <button class="tool-btn" data-tool="windmill">Windmill ($50)</button>
      <button class="tool-btn sell" data-tool="sell">Sell</button>
    </div>
  </div>

  <!-- Three.js & OrbitControls via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
