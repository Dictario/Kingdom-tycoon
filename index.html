<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Kingdom Builder</title>
<style>
:root{--panel:rgba(14,22,19,.82);--edge:rgba(255,255,255,.16);--fg:#eef3ea;--muted:#a9b9ac;--gold:#f4c95d;--bad:#ff7468}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd3f5;overscroll-behavior:none}
body{position:fixed;top:0;left:0;right:0;bottom:0;font:600 14px/1.3 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--fg);
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
#game{position:fixed;top:0;left:0;width:100%;height:100%;display:block;touch-action:none}
/* HUD layer never blocks the canvas; only the cards catch touches */
#ui{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;justify-content:space-between;pointer-events:none;
  padding:max(10px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}
header,footer{width:100%;max-width:520px;margin:0 auto}
.card{pointer-events:auto;background:var(--panel);border:1px solid var(--edge);border-radius:10px;padding:8px 12px}
small{display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
#gold{font-size:20px;color:var(--gold);font-variant-numeric:tabular-nums}
#hint{margin-bottom:8px;text-align:center;font-size:12px;color:var(--muted)}
#hint.bad{color:var(--bad);border-color:var(--bad)}
#toolbar{display:flex;padding:6px}
#toolbar button{flex:1 1 0;min-width:0;margin:0 2px;padding:8px 2px;background:none;border:1px solid transparent;border-radius:8px;color:inherit;font:inherit;cursor:pointer}
#toolbar button.on{border-color:var(--gold);background:rgba(244,201,93,.16)}
#toolbar button:focus-visible{outline:2px solid var(--gold)}
.n{display:block;font-size:13px}
.p{display:block;font-size:11px;color:var(--gold)}
#toolbar button.poor .p{color:var(--bad)}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div id="ui">
  <header><div class="card"><small>Treasury Gold</small><b id="gold">$0</b></div></header>
  <footer>
    <div id="hint" class="card"></div>
    <nav id="toolbar" class="card" aria-label="Build tools"></nav>
  </footer>
</div>

<!-- Three.js r128 + OrbitControls as globals (widest browser support); your own code is ES modules -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script type="module" src="js/main.js"></script>
</body>
</html>
